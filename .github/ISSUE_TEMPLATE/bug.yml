name: Scanner bug or installation problem
description: Installation, false positives, misses, versions or compatibility assessment.
body:
  - type: markdown
    attributes:
      value: "Never include secrets, private source, raw reports or personal paths. Confidential issues go to security@patchwrk.dev."
  - type: input
    id: version
    attributes:
      label: Scanner version or commit/archive hash, Node, pnpm and OS
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Finding type
      options:
        - Installation problem
        - Compatibility assessment problem
        - False positive
        - Missed supported pattern
        - Unsupported pattern
        - Version resolution
        - Unclear guidance or other bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction and command flags
      description: Invented paths and metadata only; no target installation or execution needed.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected versus actual provider, change ID, status and coverage warnings
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Review before public submission
      options:
        - label: I have permission to share this synthetic reproduction and removed confidential information.
          required: true
