name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Keep existing branch-protection check names while pinning the actual runner.
    name: verify (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ubuntu-latest
            runner: ubuntu-24.04
          - check: macos-latest
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm benchmark
      - run: pnpm build
      - run: pnpm package:check
      - run: node scripts/create-pilot-package.mjs --public-candidate
      - run: node scripts/verify-pilot-package.mjs --public-candidate
      - run: node dist/index.js --help
      - run: node dist/index.js scan tests/fixtures/empty --json
      - run: node dist/index.js changes --coverage --json

