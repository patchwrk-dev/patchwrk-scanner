name: Product public availability
on:
  schedule:
    - cron: '7,37 * * * *'
      timezone: America/Chicago
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-public-availability
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify owned repository and probe contracts
        env:
          OBSERVED_REPOSITORY: ${{ github.repository }}
        run: |
          test "$OBSERVED_REPOSITORY" = 'patchwrk-dev/patchwrk-scanner'
          node --test scripts/ops/public-health.test.mjs
      - name: Bounded public checks; failure report stays in the job summary
        run: node scripts/ops/public-health.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
